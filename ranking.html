<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1e0710" />
  <title>Run to My Love - Ranking</title>
  <link rel="stylesheet" href="ranking.css" />
</head>
<body>
  <!-- Ranking for a big screen at the wedding. Reads the Google Sheet through
       the same Apps Script URL as the game (SCORE_API_URL in src/config.js).
       Options: ranking.html?limit=20 (players shown, 1-20), ?refresh=15 (seconds) -->
  <main id="board">
    <header class="board-header">
      <p class="board-couple" id="couple"></p>
      <h1 class="board-title" id="title">Run to My Love</h1>
      <p class="board-subtitle">RANKING</p>
    </header>

    <section class="podium" id="podium" aria-label="Top 3"></section>

    <ol class="ranking-list" id="list" aria-label="Ranking" hidden></ol>

    <p class="board-message" id="message" hidden></p>

    <footer class="board-footer">
      <span class="live" id="live"><span class="live-dot"></span><span id="status">LOADING...</span></span>
      <span id="stats"></span>
    </footer>
  </main>

  <noscript>Please enable JavaScript to see the ranking.</noscript>

  <script type="module" src="src/ranking.js"></script>
</body>
</html>
